## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat Nov 19 15:59:34 CST 2022

org.gradle.jvmargs=-Xmx3072M -XX:MaxMetaspaceSize=768m -Dkotlin.daemon.jvm.options\="-Xmx2048M"
# The `full` flavour pulls in :ffMetadataEx, which asks for a JDK 21 toolchain. `core` builds fine
# on JDK 17 alone, so most people need nothing here.
#
# If your JDK 21 is somewhere Gradle does not auto-detect, point it there from your own
# ~/.gradle/gradle.properties rather than from this file:
#
#     org.gradle.java.installations.paths=/path/to/your/jdk-21
#
# It used to be set here, with one machine's absolute path, which every clone then inherited and
# no clone could use. F-Droid's buildserver said so out loud in its log.
android.useAndroidX=true
android.enableJetifier=true
org.gradle.unsafe.configuration-cache=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false
