blank_issues_enabled: false
contact_links:
  - name: A question, or you are not sure it is a bug
    url: https://github.com/ItzSkyeYT/InterTune/discussions/categories/q-a
    about: "Ask in Discussions instead. Nothing gets closed for being in the wrong place, but questions are easier to answer there, other people can answer them, and the answers stay findable."

  - name: Playback stops partway through every track on upstream OuterTune
    url: https://github.com/ItzSkyeYT/InterTune/releases/latest
    about: "That is the known upstream bug InterTune was made to fix, and it needs no issue: install InterTune, which sits alongside OuterTune rather than replacing it. If it happens on InterTune itself, that is new and I want the report, so open a bug and say so."

  - name: A translation reads wrong in your language
    url: https://github.com/ItzSkyeYT/InterTune/issues/new?template=translation_report.yml
    about: "Most of the translations were not written by native speakers, so please do say if something is wrong, awkward or still in English. A one line report is plenty and you do not need to suggest a replacement."
