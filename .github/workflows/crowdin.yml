name: Crowdin

on:
  workflow_dispatch:
  push:
    branches:
      - visionos-fix
    paths:
      # Only when the source strings actually move. Translations coming back must not retrigger
      # this, or the download commit starts the workflow that made it.
      - 'app/src/main/res/values/strings-ot.xml'
  schedule:
    # Monday morning, to pick up whatever was translated over the week.
    - cron: '0 6 * * 1'

concurrency:
  group: crowdin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Without the secrets this would run on every fork and fail on every push. Skipped instead.
    if: github.repository == 'ItzSkyeYT/InterTune'
    steps:
      - uses: actions/checkout@v4

      - name: Upload sources and open a PR with what came back
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true

          # A pull request, not a direct push. Translations land in 48 locale files at once and
          # that is not a diff to take unseen, least of all in languages nobody here reads.
          create_pull_request: true
          localization_branch_name: crowdin/translations
          pull_request_title: 'Translations from Crowdin'
          pull_request_base_branch_name: visionos-fix

          # Ours alone. Anything Crowdin does not know about stays as it is rather than being
          # emptied, which matters while most of the file is still untranslated.
          skip_untranslated_strings: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
