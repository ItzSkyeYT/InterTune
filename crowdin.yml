# Crowdin, for InterTune's own strings only.
#
# strings.xml is OuterTune's 243 strings and is translated on their Weblate. It arrives here
# through upstream merges, so it must not be uploaded: Crowdin would write over a merge, or a
# merge over Crowdin, and whichever lost would keep losing. strings-ot.xml is ours, 781 strings
# and roughly half of them untranslated, and nothing upstream touches it.
#
# values-en-rCA is English, not a translation. It is the file en-GB and en-AU read ahead of
# values/, so it is maintained by hand alongside the source and never round-tripped.

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

preserve_hierarchy: true

files:
  - source: /app/src/main/res/values/strings-ot.xml
    translation: /app/src/main/res/values-%android_code%/strings-ot.xml
    ignore:
      - /app/src/main/res/values-en-rCA/**

    # Android wants the legacy codes in its directory names and the existing folders already use
    # them. Pinned rather than assumed so a Crowdin default change cannot silently start writing
    # values-id beside values-in and leave two half-translated Indonesians.
    languages_mapping:
      android_code:
        id: in
        he: iw
        yi: ji
        nb: nb-rNO
        pt-BR: pt-rBR
        es-US: es-rUS
        zh-CN: zh-rCN
        zh-TW: zh-rTW
        bn-IN: bn-rIN
        sr-Latn: b+sr+Latn
