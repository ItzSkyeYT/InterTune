# Credentials for the maintainer's own services, built into the app.
#
# Public on purpose. F-Droid's reproducible build has to produce exactly the APK that was
# published, so everything that goes into it has to be in the source, and these were only lightly
# hidden in the published APK anyway. They work only in the app signed with the InterTune release
# key (see BuiltInKeys.kt): a fork or a clone signed with any other key gets none of them.
#
# Expected entries:
#   lastfm.apiKey, lastfm.apiSecret   the Last.fm API account (last.fm/api/account/create).
#                                     Revoke and replace it if it is ever abused.
#   polls.gistUrl                     the gist holding the poll questions
#   polls.umamiUrl, polls.umamiWebsiteId
#                                     the Umami site poll answers are recorded on
